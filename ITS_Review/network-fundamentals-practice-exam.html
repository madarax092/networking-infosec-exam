<title>Network Security Practice Exam</title>
<style>
/* layout: single-column exam sheet, question cards stack top to bottom, fixed score bar pinned above content on desktop */
:root{
  --bg:#f3f1ec;
  --surface:#ffffff;
  --ink:#1c1b19;
  --muted:#6b675f;
  --line:#ddd8cd;
  --accent:#1e5c4a;
  --accent-ink:#eaf3ef;
  --wrong:#a13d2f;
  --wrong-bg:#f8ece9;
  --right:#1e5c4a;
  --right-bg:#e9f2ee;
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a;
    --surface:#212225;
    --ink:#ece9e2;
    --muted:#9b9791;
    --line:#37393c;
    --accent:#5fbf9c;
    --accent-ink:#0f1b17;
    --wrong:#e08a7a;
    --wrong-bg:#332320;
    --right:#5fbf9c;
    --right-bg:#173028;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17181a;
  --surface:#212225;
  --ink:#ece9e2;
  --muted:#9b9791;
  --line:#37393c;
  --accent:#5fbf9c;
  --accent-ink:#0f1b17;
  --wrong:#e08a7a;
  --wrong-bg:#332320;
  --right:#5fbf9c;
  --right-bg:#173028;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;padding-inline:16px;padding-block:32px}
.wrap{max-width:760px;margin:0 auto}

.masthead{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.masthead h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:1.55rem;font-weight:600;margin:0 0 4px;text-wrap:balance}
.masthead p{margin:0;color:var(--muted);font-size:.85rem}
.badge{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}

.progressbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 14px;margin-bottom:8px}
.progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .25s ease}
.progress-label{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 20px 18px;margin-bottom:14px}
.q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q-num{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--accent);font-weight:600;flex-shrink:0}
.q-domain{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.q-text{font-size:1rem;line-height:1.5;margin:0 0 14px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer;font-size:.92rem;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:3px;accent-color:var(--accent);flex-shrink:0}
.opt.correct{border-color:var(--right);background:var(--right-bg)}
.opt.incorrect{border-color:var(--wrong);background:var(--wrong-bg)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line)}
.opt.correct:hover, .opt.incorrect:hover{border-color:inherit}

.explain{display:none;margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0;font-size:.85rem;line-height:1.5;color:var(--muted)}
.explain b{color:var(--ink)}
.explain.show{display:block}

.footer-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.footer-bar span{font-size:.85rem;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:.88rem;background:var(--accent);color:var(--accent-ink);border:none;border-radius:7px;padding:11px 20px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.results{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 22px;margin-bottom:18px;text-align:center;display:none}
.results.show{display:block}
.results .score{font-family:"IBM Plex Serif",Georgia,serif;font-size:2.6rem;font-weight:600;margin:0}
.results .sub{color:var(--muted);font-size:.9rem;margin-top:4px}

[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">

<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Network Security Practice Exam</h1>
      <p>IT Specialist &ndash; Cybersecurity · Networking Fundamentals domain</p>
    </div>
    <span class="badge" id="qcount-badge">20 questions</span>
  </div>

  <div class="progressbar">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">0 of 20 answered</span><span id="live-score"></span></div>
  </div>

  <div class="results" id="results">
    <p class="score" id="score-text">0 / 20</p>
    <p class="sub" id="score-sub">Review your answers below, or retake the exam.</p>
  </div>

  <div id="quiz"></div>

  <div class="footer-bar">
    <span id="footer-hint">Answer every question, then submit to see your score and explanations.</span>
    <div style="display:flex;gap:10px">
      <button class="ghost" id="reset-btn" hidden>Retake exam</button>
      <button id="submit-btn" disabled>Submit exam</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    domain: "OSI Model",
    text: "At which layer of the OSI model do routers primarily operate to make forwarding decisions?",
    options: ["Layer 2 – Data Link", "Layer 3 – Network", "Layer 4 – Transport", "Layer 7 – Application"],
    correct: 1,
    explain: "Routers forward traffic based on <b>IP addresses</b>, which live at Layer 3 (Network). Switches operate at Layer 2 using MAC addresses."
  },
  {
    domain: "Protocols",
    text: "Which protocol should replace Telnet to secure remote command-line administration?",
    options: ["SFTP", "HTTPS", "SSH", "SNMPv3"],
    correct: 2,
    explain: "<b>SSH</b> encrypts remote terminal sessions end to end. Telnet sends credentials and commands in cleartext, making it vulnerable to sniffing."
  },
  {
    domain: "Ports",
    text: "A firewall log shows outbound traffic on TCP port 443. What is the traffic most likely doing?",
    options: ["Unencrypted web browsing", "Encrypted web browsing (HTTPS)", "DNS resolution", "Remote desktop access"],
    correct: 1,
    explain: "Port 443 is the standard port for <b>HTTPS</b>, which wraps HTTP in TLS/SSL encryption. Port 80 is plain HTTP."
  },
  {
    domain: "Devices",
    text: "Which device inspects traffic and can both detect AND actively block malicious activity in real time?",
    options: ["IDS (Intrusion Detection System)", "IPS (Intrusion Prevention System)", "Proxy server", "Switch"],
    correct: 1,
    explain: "An <b>IPS</b> sits inline with traffic and can drop malicious packets automatically. An IDS only detects and alerts — it does not block."
  },
  {
    domain: "Wireless",
    text: "Which wireless security protocol is considered obsolete and should never be used due to easily crackable encryption?",
    options: ["WPA3", "WPA2-Enterprise", "WEP", "WPA2-Personal"],
    correct: 2,
    explain: "<b>WEP</b> uses a flawed RC4 implementation and can be cracked in minutes with widely available tools. WPA2 and WPA3 are current standards."
  },
  {
    domain: "Attacks / CIA Triad",
    text: "An attacker intercepts and reads traffic between two hosts without altering it. Which leg of the CIA triad is most directly violated?",
    options: ["Integrity", "Availability", "Confidentiality", "Non-repudiation"],
    correct: 2,
    explain: "Passive interception such as <b>eavesdropping or sniffing</b> breaks confidentiality — the data is exposed even though it isn't changed or made unavailable."
  },
  {
    domain: "Architecture",
    text: "A company wants to host a public web server while keeping it isolated from the internal LAN. Where should the server be placed?",
    options: ["Inside the internal VLAN", "In a DMZ", "On the same subnet as domain controllers", "Directly on the core switch"],
    correct: 1,
    explain: "A <b>DMZ (demilitarized zone)</b> sits between two firewalls, exposing public-facing services to the internet while shielding the internal network."
  },
  {
    domain: "Addressing",
    text: "Which IPv4 address range is reserved for private (non-routable) networks?",
    options: ["8.8.8.0/24", "192.168.0.0/16", "1.1.1.0/24", "203.0.113.0/24"],
    correct: 1,
    explain: "192.168.0.0/16 (along with 10.0.0.0/8 and 172.16.0.0/12) is reserved by RFC 1918 for <b>private addressing</b> and is not routed on the public internet."
  },
  {
    domain: "Attacks",
    text: "A user's browser is silently redirected to a fake banking site after their computer's ARP cache was manipulated. What attack technique enabled this?",
    options: ["DNS poisoning", "ARP spoofing (a form of MITM)", "Port scanning", "Session hijacking"],
    correct: 1,
    explain: "<b>ARP spoofing</b> tricks a host into associating the attacker's MAC address with a legitimate IP, letting the attacker intercept and redirect traffic — a classic man-in-the-middle setup."
  },
  {
    domain: "VPN",
    text: "Which IPSec mode encrypts only the payload of a packet, leaving the original IP header intact, and is typically used for host-to-host communication?",
    options: ["Tunnel mode", "Transport mode", "Gateway mode", "Aggressive mode"],
    correct: 1,
    explain: "<b>Transport mode</b> encrypts just the payload. <b>Tunnel mode</b> encrypts the entire original packet and wraps it in a new IP header — the mode used for site-to-site VPNs."
  },
  {
    domain: "Protocols",
    text: "Which port does DNS use by default for standard lookups?",
    options: ["Port 25", "Port 53", "Port 110", "Port 389"],
    correct: 1,
    explain: "DNS uses <b>port 53</b> (UDP for standard queries, TCP for zone transfers and large responses)."
  },
  {
    domain: "Devices",
    text: "What is the primary security benefit of Network Address Translation (NAT)?",
    options: ["It encrypts all outbound traffic", "It hides internal IP addressing from external networks", "It authenticates wireless clients", "It replaces the need for a firewall"],
    correct: 1,
    explain: "NAT translates private internal addresses to a public address, which <b>obscures the internal network's addressing scheme</b> from outside observers. It does not encrypt traffic."
  },
  {
    domain: "Attacks",
    text: "A server becomes unreachable after being flooded with an overwhelming volume of traffic from thousands of compromised hosts. This is an example of:",
    options: ["Phishing", "DDoS attack", "SQL injection", "Privilege escalation"],
    correct: 1,
    explain: "A <b>Distributed Denial of Service (DDoS)</b> attack uses many hosts (often a botnet) to overwhelm a target's resources or bandwidth, violating <b>availability</b>."
  },
  {
    domain: "Wireless",
    text: "What distinguishes WPA2-Enterprise from WPA2-Personal?",
    options: ["Enterprise uses a shared pre-shared key for all users", "Enterprise authenticates each user individually via 802.1X/RADIUS", "Personal supports stronger AES encryption", "Personal is only used in corporate settings"],
    correct: 1,
    explain: "<b>WPA2-Enterprise</b> requires individual authentication against a RADIUS server (802.1X), giving each user unique credentials. <b>WPA2-Personal</b> uses one shared pre-shared key (PSK) for everyone."
  },
  {
    domain: "Segmentation",
    text: "What is the main security purpose of implementing VLANs on a switched network?",
    options: ["To increase internet bandwidth", "To logically segment broadcast domains and limit lateral movement", "To encrypt traffic between hosts", "To assign public IP addresses automatically"],
    correct: 1,
    explain: "<b>VLANs</b> divide a physical network into isolated logical segments, reducing the attack surface by limiting which devices can directly communicate with each other."
  },
  {
    domain: "Protocols",
    text: "Which secure protocol should replace plain FTP for transferring files with encryption?",
    options: ["TFTP", "SFTP", "SMTP", "RTP"],
    correct: 1,
    explain: "<b>SFTP</b> (SSH File Transfer Protocol) transfers files over an encrypted SSH connection. Plain FTP sends credentials and data in cleartext."
  },
  {
    domain: "Attacks",
    text: "An attacker captures a valid session token from network traffic and uses it to impersonate a logged-in user. This is known as:",
    options: ["Session hijacking", "Brute forcing", "Social engineering", "Buffer overflow"],
    correct: 0,
    explain: "<b>Session hijacking</b> involves stealing or predicting a valid session token to impersonate an authenticated user without needing their credentials."
  },
  {
    domain: "Addressing",
    text: "What is the purpose of a subnet mask such as 255.255.255.0?",
    options: ["It encrypts IP packets", "It defines which portion of an IP address identifies the network vs. the host", "It assigns a MAC address to a device", "It filters traffic by port number"],
    correct: 1,
    explain: "A subnet mask separates an IP address into <b>network and host portions</b>, determining which addresses belong to the same local subnet. 255.255.255.0 (/24) leaves 8 bits for host addressing."
  },
  {
    domain: "Devices",
    text: "Which device would you deploy specifically to lure and observe attackers in a controlled, monitored environment?",
    options: ["Honeypot", "Load balancer", "NAC appliance", "Reverse proxy"],
    correct: 0,
    explain: "A <b>honeypot</b> is a decoy system designed to attract attackers, letting defenders study techniques and detect intrusions without risking real assets."
  },
  {
    domain: "Protocols",
    text: "Which port is used by RDP (Remote Desktop Protocol) by default?",
    options: ["22", "443", "3389", "8080"],
    correct: 2,
    explain: "RDP defaults to <b>TCP port 3389</b>. It's frequently targeted by brute-force attacks when exposed directly to the internet without additional controls."
  }
];

const quizEl = document.getElementById('quiz');
const state = new Array(QUESTIONS.length).fill(null);
let submitted = false;

function render(){
  quizEl.innerHTML = QUESTIONS.map((q, qi) => `
    <div class="q" data-qi="${qi}">
      <div class="q-head">
        <span class="q-num">Q${qi+1}</span>
        <span class="q-domain">${q.domain}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <div class="opts">
        ${q.options.map((opt, oi) => `
          <label class="opt" data-oi="${oi}">
            <input type="radio" name="q${qi}" value="${oi}">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="explain" id="explain-${qi}"><b>Why:</b> ${q.explain}</div>
    </div>
  `).join('');

  QUESTIONS.forEach((q, qi) => {
    quizEl.querySelectorAll(`.q[data-qi="${qi}"] .opt`).forEach(optEl => {
      optEl.addEventListener('click', (e) => {
        if (submitted) return;
        const oi = parseInt(optEl.dataset.oi, 10);
        state[qi] = oi;
        const input = optEl.querySelector('input');
        input.checked = true;
        updateProgress();
      });
    });
  });
}

function updateProgress(){
  const answered = state.filter(s => s !== null).length;
  const pct = Math.round((answered / QUESTIONS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answered} of ${QUESTIONS.length} answered`;
  document.getElementById('submit-btn').disabled = answered !== QUESTIONS.length || submitted;
}

function submitExam(){
  submitted = true;
  let score = 0;
  QUESTIONS.forEach((q, qi) => {
    const correctOi = q.correct;
    const chosenOi = state[qi];
    if (chosenOi === correctOi) score++;
    const optsEls = quizEl.querySelectorAll(`.q[data-qi="${qi}"] .opt`);
    optsEls.forEach(optEl => {
      const oi = parseInt(optEl.dataset.oi, 10);
      optEl.classList.add('locked');
      if (oi === correctOi) optEl.classList.add('correct');
      else if (oi === chosenOi) optEl.classList.add('incorrect');
    });
    document.getElementById(`explain-${qi}`).classList.add('show');
  });

  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('score-text').textContent = `${score} / ${QUESTIONS.length}`;
  document.getElementById('score-sub').textContent = pct >= 80
    ? `${pct}% — solid grasp of the networking domain. Review any misses below.`
    : pct >= 60
      ? `${pct}% — passing range for most Certiport thresholds, but review the misses below before test day.`
      : `${pct}% — worth another study pass on the missed topics before you sit the exam.`;
  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});

  document.getElementById('submit-btn').hidden = true;
  document.getElementById('reset-btn').hidden = false;
  document.getElementById('footer-hint').textContent = 'Green = correct answer. Red = your incorrect pick. Explanations are shown under each question.';
}

function resetExam(){
  submitted = false;
  state.fill(null);
  document.getElementById('results').classList.remove('show');
  document.getElementById('submit-btn').hidden = false;
  document.getElementById('reset-btn').hidden = true;
  document.getElementById('footer-hint').textContent = 'Answer every question, then submit to see your score and explanations.';
  render();
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('submit-btn').addEventListener('click', submitExam);
document.getElementById('reset-btn').addEventListener('click', resetExam);
document.getElementById('qcount-badge').textContent = QUESTIONS.length + ' questions';

render();
updateProgress();
</script>
